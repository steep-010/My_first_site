<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js" defer></script>
    <title>Контакты</title>
</head>

<body>
    <h1>Контакты</h1>
    <p>Как можно связаться:</p>
    <ul>
        <li>Почта: example@gmail.com</li>
        <li>Мобильный телефон: +79999999999</li>
    </ul>

    <h2>Обратная связь</h2>
    <form id="contactForm" class="mb-3" style="max-width: 400px;">
        <input id="name" class="form-control mb-2" placeholder="Имя">
        <input id="email" class="form-control mb-2" placeholder="Email">
        <textarea id="comment" class="form-control mb-2" placeholder="Комментарий"></textarea>
        <button class="btn btn-primary">Отправить</button>
    </form>
    <p id="formMessage"></p>
    <a href="./index.html">Назад</a>
</body>

</html>
